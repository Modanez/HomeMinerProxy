version: "3.7"

services:
  # Tela do painel atrás do proxy do Umbrel (login do Umbrel na frente)
  app_proxy:
    environment:
      APP_HOST: modanez-homeminerproxy_painel_1
      APP_PORT: 3000

  proxy:
    image: ghcr.io/modanez/homeminerproxy:latest
    command: ["node", "proxy.js"]
    restart: unless-stopped   # o painel sai com código 0 para reiniciar depois do assistente e ao salvar
    stop_grace_period: 30s
    environment:
      DATA_DIR: /data
      PROXY_STATS_HOST: 0.0.0.0
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # portas Stratum abertas direto no IP do Umbrel (os mineradores não passam pelo login)
    ports:
      - "3333:3333"   # public-pool
      - "3334:3334"   # ckpool solo
      - "3335:3335"   # nerdminers
      - "3340:3340"   # bitronics (NerdMiner)
      - "3341:3341"   # bitronics ASIC (Bitaxe: solo ou #grupo)
      - "3337:3337"   # OCEAN
      - "3338:3338"   # atlaspool
      - "3339:3339"   # ckpool solo EU

  painel:
    image: ghcr.io/modanez/homeminerproxy:latest
    command: ["node", "painel.js"]
    restart: unless-stopped   # o painel sai com código 0 para reiniciar depois do assistente e ao salvar
    stop_grace_period: 30s
    environment:
      DATA_DIR: /data
      PORT: "3000"
      PROXY_URL: http://modanez-homeminerproxy_proxy_1:3336/stats
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - proxy
