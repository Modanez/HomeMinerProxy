name: SD card images

# Imagens prontas para gravar no cartão (Raspberry Pi 3/4/5, Orange Pi Zero 3, Odroid-C2).
# - release publicada: monta as três e anexa na release
# - manual (Actions → SD card images → Run workflow) ou push na branch de desenvolvimento: deixa como artefato
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      boards:
        description: 'Placas, separadas por espaço / boards, space separated'
        default: 'rpi orangepizero3 odroidc2'
  push:
    branches: [feat/sd-images]
    paths: ['image/**', 'install.sh', '.github/workflows/images.yml']

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.b.outputs.boards }}
    steps:
      - id: b
        run: |
          list="${{ github.event.inputs.boards }}"
          [ -n "$list" ] || list="rpi orangepizero3 odroidc2"
          echo "boards=$(printf '%s\n' $list | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.plan.outputs.boards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # o repositório vai inteiro para a imagem (botão "Atualizar")
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support cloud-guest-utils parted e2fsprogs xz-utils
      - name: Build
        run: sudo image/build.sh ${{ matrix.board }} "$GITHUB_WORKSPACE/homeminer-${{ matrix.board }}.img.xz"
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "homeminer-${{ matrix.board }}.img.xz" "homeminer-${{ matrix.board }}.img.xz.sha256" --clobber
      - name: Keep as artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v5
        with:
          name: homeminer-${{ matrix.board }}
          path: |
            homeminer-${{ matrix.board }}.img.xz
            homeminer-${{ matrix.board }}.img.xz.sha256
          retention-days: 14
          compression-level: 0
