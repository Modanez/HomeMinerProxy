name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Python + Pillow (cube tests)
        run: sudo apt-get update && sudo apt-get install -y python3-pil fonts-dejavu-core
      - run: npm run check
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        run: docker build -t homeminerproxy:ci .

      - name: Smoke test (dashboard, proxy and cube start)
        run: |
          cp config/mineracao.env.example mineracao.env
          sed -i 's/^BTC_ADDRESS=$/BTC_ADDRESS=bc1qexample/' mineracao.env
          docker compose up -d proxy painel
          for i in $(seq 1 30); do curl -sf localhost:3000/api/widget && break; sleep 2; done
          curl -sf localhost:3000/api/widget
          curl -sf "localhost:3000/?lang=en" | grep -q "Mining"
          docker compose exec -T painel wget -qO- http://proxy:3336/stats | grep -q '"routes"'
          docker run --rm homeminerproxy:ci python3 -c "import cubo; print(cubo.hashrate(1.2e12))"

      - name: Smoke test (optional CPU miner profile)
        run: |
          docker compose --profile minerador build minerador
          docker run --rm --entrypoint minerd homeminer-minerador:latest --help 2>&1 | grep -q sha256d
          docker compose --profile minerador up -d minerador
          sleep 20
          test "$(docker compose ps -q minerador | xargs docker inspect -f '{{.State.Running}}')" = true
          docker compose logs minerador | tail -5

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Build and push multi-arch image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
